[package]
name = "virglrs"
version = "1.3.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "virglrenderer"
crate-type = ["cdylib"]

# Panics abort, never unwind. Unwinding across `extern "C"` is undefined behaviour, and a loud
# abort is the behaviour we want from a violated host invariant anyway -- see CLAUDE.md.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
libc = "0.2"
