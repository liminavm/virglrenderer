[package]
name = "virglrs"
version = "1.3.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "virglrenderer"
crate-type = ["cdylib", "rlib"]

# Panics abort, never unwind. Unwinding across `extern "C"` is undefined behaviour, and a loud
# abort is the behaviour we want from a violated host invariant anyway -- see CLAUDE.md.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
# Build venus-protocol's own C renderer encoder and link it into the tests, so the generated Rust
# reply encoders can be diffed against it byte for byte. Off by default: the shipping dylib has no
# C in it, and keeping it that way is the point of the rewrite.
reply-oracle = ["dep:cc"]

# Build the C tree's video bitstream serializers and link them into the tests, so the Rust ports
# can be diffed against them byte for byte. The C is the only reference these have -- there is no
# conformance vector for a synthesized parameter set -- so agreeing with it is the whole standard.
video-oracle = ["dep:cc"]

[dependencies]
bumpalo = "3.20"
bytemuck = { version = "1.25.2", features = ["derive"] }
libc = "0.2"

[build-dependencies]
cc = { version = "1.4", optional = true }
