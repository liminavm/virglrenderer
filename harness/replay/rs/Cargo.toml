[package]
name = "vkr-replay"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "vkr-replay"
path = "src/main.rs"

[[bin]]
name = "venus-roundtrip"
path = "src/roundtrip.rs"

# Needs venus-protocol's C renderer encoder built and linked, which the other two do not.
[[bin]]
name = "venus-reply-oracle"
path = "src/reply_oracle.rs"
required-features = ["reply-oracle"]

[features]
reply-oracle = ["virglrenderer/reply-oracle"]

[dependencies]
bumpalo = "3.20"
libc = "0.2"
virglrenderer = { package = "virglrs", path = "../../../virglrs" }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
